[package]
name = "bisimulationrs"
description = "Coalgebraic process-algebra primitives for comparing streaming and stochastic systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bisim-core.workspace = true
bisim-refine.workspace = true
bisim-algebra.workspace = true
bisim-pepa-macros.workspace = true
bisim-stochastic.workspace = true
bisim-metric.workspace = true
futures-core.workspace = true

[features]
# Experimental: a learned Spoiler for the bisimulation game (ROADMAP §4e).
learned-challenger = ["bisim-refine/learned-challenger"]

[dev-dependencies]
criterion.workspace = true
# Builds and tests the experimental challenger with the workspace.
bisim-refine = { workspace = true, features = ["learned-challenger"] }

[[example]]
name = "learned_challenger"
required-features = ["learned-challenger"]

[[bench]]
name = "workloads"
harness = false

[lints]
workspace = true
