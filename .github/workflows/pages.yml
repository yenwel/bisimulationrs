name: Build and deploy PEPA Studio to GitHub Pages (using web/build.sh)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: actions/setup-rust@v2
        with:
          rust-version: stable

      - name: Ensure wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Make build script executable
        run: chmod +x web/build.sh

      - name: Build site using web/build.sh
        run: sh web/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1