[workspace]
resolver = "3"
members = [
    "crates/bisim-core",
    "crates/bisim-refine",
    "crates/bisim-algebra",
    "crates/bisim-pepa-macros",
    "crates/bisim-stochastic",
    "crates/bisim-metric",
    "crates/bisim-api",
    "crates/bisim-wasm",
    "crates/bisimulationrs",
]
# Built separately by maturin (python/) and R CMD INSTALL (r/).
exclude = ["crates/bisim-py", "r/src/rust"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jan Vandepitte"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yenwel/bisimulationrs"

[workspace.dependencies]
bisim-core = { path = "crates/bisim-core", version = "0.2.0" }
bisim-refine = { path = "crates/bisim-refine", version = "0.2.0" }
bisim-algebra = { path = "crates/bisim-algebra", version = "0.2.0" }
bisim-pepa-macros = { path = "crates/bisim-pepa-macros", version = "0.2.0" }
bisim-stochastic = { path = "crates/bisim-stochastic", version = "0.2.0" }
bisim-metric = { path = "crates/bisim-metric", version = "0.2.0" }
bisim-api = { path = "crates/bisim-api", version = "0.2.0" }
futures-core = "0.3"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = "1"
quote = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The numerical training and estimation loops in bisim-metric are 10–30×
# slower unoptimised, which made its tests take minutes in debug builds.
[profile.dev.package.bisim-metric]
opt-level = 3
